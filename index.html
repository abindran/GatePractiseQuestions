<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>GATE Practice — Questions</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Source+Serif+4:opsz,wght@8..60,500;8..60,700&family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,400&display=swap" rel="stylesheet" />
  <style>
    :root {
      --ink: #0f1a14;
      --paper: #f3f6f2;
      --panel: #ffffff;
      --line: #d5ddd4;
      --muted: #5a6b60;
      --accent: #0d6e4f;
      --accent-soft: #d8efe6;
      --warn: #9a4a12;
      --warn-soft: #fde8d6;
      --bad: #8b1e2d;
      --bad-soft: #f8e0e4;
      --good: #0d6e4f;
      --good-soft: #d8efe6;
      --shadow: 0 10px 30px rgba(15, 26, 20, 0.06);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      font-family: "DM Sans", sans-serif;
      background:
        radial-gradient(1200px 500px at 10% -10%, #dff0e8 0%, transparent 55%),
        radial-gradient(900px 400px at 100% 0%, #efe6d8 0%, transparent 50%),
        linear-gradient(180deg, #eef3ec 0%, var(--paper) 40%, #e8eee6 100%);
    }
    header {
      max-width: 980px;
      margin: 0 auto;
      padding: 2.25rem 1.25rem 1rem;
    }
    .header-row {
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
      align-items: flex-start;
      justify-content: space-between;
    }
    .header-copy { min-width: min(100%, 20rem); flex: 1; }
    header h1 {
      font-family: "Source Serif 4", Georgia, serif;
      font-weight: 700;
      font-size: clamp(1.8rem, 4vw, 2.5rem);
      letter-spacing: -0.02em;
      margin: 0 0 0.4rem;
    }
    header p { margin: 0; color: var(--muted); max-width: 42rem; line-height: 1.5; }
    .auth-box {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      align-items: center;
      justify-content: flex-end;
      max-width: 22rem;
    }
    .auth-box .auth-meta {
      width: 100%;
      text-align: right;
      font-family: "IBM Plex Mono", monospace;
      font-size: 0.78rem;
      color: var(--muted);
      line-height: 1.35;
    }
    .sync-dot {
      display: inline-block;
      width: 0.5rem;
      height: 0.5rem;
      border-radius: 50%;
      background: #b7b7b7;
      margin-right: 0.35rem;
      vertical-align: middle;
    }
    .sync-dot.on { background: var(--accent); }
    .sync-dot.warn { background: var(--warn); }

    main {
      max-width: 980px;
      margin: 0 auto;
      padding: 0 1.25rem 3rem;
      display: grid;
      gap: 1rem;
    }
    .hidden { display: none !important; }

    select, button, input[type="text"] {
      font: inherit;
      border: 1px solid var(--line);
      background: var(--panel);
      color: var(--ink);
      border-radius: 10px;
      padding: 0.55rem 0.8rem;
    }
    select { min-width: 9rem; }
    button {
      cursor: pointer;
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
      font-weight: 560;
    }
    button.secondary {
      background: var(--panel);
      color: var(--ink);
      border-color: var(--line);
    }
    button:disabled { opacity: 0.55; cursor: not-allowed; }

    .breadcrumb {
      display: flex;
      flex-wrap: wrap;
      gap: 0.35rem;
      align-items: center;
      font-family: "IBM Plex Mono", monospace;
      font-size: 0.82rem;
      color: var(--muted);
    }
    .breadcrumb button.linkish {
      background: none;
      border: none;
      color: var(--accent);
      padding: 0;
      font: inherit;
      font-weight: 560;
      text-decoration: underline;
      text-underline-offset: 2px;
    }

    .page-title {
      font-family: "Source Serif 4", Georgia, serif;
      font-size: clamp(1.4rem, 3vw, 1.9rem);
      font-weight: 700;
      margin: 0.35rem 0 0.25rem;
    }
    .page-sub {
      margin: 0 0 0.5rem;
      color: var(--muted);
      font-size: 0.95rem;
    }

    .progress-track {
      height: 8px;
      border-radius: 999px;
      background: #e4ebe4;
      overflow: hidden;
      margin: 0.55rem 0 0.25rem;
    }
    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, #1a8f68, #0d6e4f);
      border-radius: 999px;
      transition: width 0.25s ease;
    }
    .progress-label {
      font-family: "IBM Plex Mono", monospace;
      font-size: 0.78rem;
      color: var(--muted);
    }

    .subject-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 0.85rem;
    }
    .subject-card {
      text-align: left;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 16px;
      box-shadow: var(--shadow);
      padding: 1.1rem 1.15rem 1.15rem;
      cursor: pointer;
      color: inherit;
      display: grid;
      gap: 0.35rem;
    }
    .subject-card:hover { border-color: #a9c4b8; }
    .subject-card h2 {
      font-family: "Source Serif 4", Georgia, serif;
      font-size: 1.25rem;
      margin: 0;
      font-weight: 700;
    }
    .subject-card .meta {
      font-family: "IBM Plex Mono", monospace;
      font-size: 0.78rem;
      color: var(--muted);
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 0.55rem;
      align-items: center;
    }
    .toolbar .stats {
      margin-left: auto;
      font-family: "IBM Plex Mono", monospace;
      font-size: 0.85rem;
      color: var(--muted);
    }

    .card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 16px;
      box-shadow: var(--shadow);
      padding: 1.15rem 1.2rem 1.25rem;
    }
    .meta-row {
      display: flex;
      flex-wrap: wrap;
      gap: 0.45rem;
      margin-bottom: 0.85rem;
    }
    .chip {
      font-size: 0.75rem;
      font-family: "IBM Plex Mono", monospace;
      padding: 0.22rem 0.55rem;
      border-radius: 999px;
      background: var(--accent-soft);
      color: var(--accent);
      border: 1px solid #b7dccf;
    }
    .chip.muted {
      background: #eef1ee;
      color: var(--muted);
      border-color: var(--line);
    }
    .chip.ok {
      background: var(--good-soft);
      color: var(--good);
      border-color: #b7dccf;
    }
    .q-text {
      font-family: "Source Serif 4", Georgia, serif;
      font-size: 1.18rem;
      line-height: 1.45;
      white-space: pre-wrap;
      margin: 0 0 1rem;
    }
    .options { display: grid; gap: 0.5rem; margin-bottom: 0.9rem; }
    .option {
      display: flex;
      gap: 0.65rem;
      align-items: flex-start;
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 0.7rem 0.8rem;
      cursor: pointer;
      background: #fbfcfb;
    }
    .option:hover { border-color: #a9c4b8; }
    .option.selected { border-color: var(--accent); background: var(--accent-soft); }
    .option.correct { border-color: var(--good); background: var(--good-soft); }
    .option.wrong { border-color: var(--bad); background: var(--bad-soft); }
    .option input { margin-top: 0.2rem; }
    .answer-box { width: 100%; margin-bottom: 0.9rem; }
    .actions { display: flex; flex-wrap: wrap; gap: 0.5rem; }
    .feedback {
      margin-top: 0.9rem;
      padding: 0.8rem 0.9rem;
      border-radius: 12px;
      display: none;
      line-height: 1.45;
    }
    .feedback.show { display: block; }
    .feedback.ok { background: var(--good-soft); border: 1px solid #b7dccf; }
    .feedback.no { background: var(--bad-soft); border: 1px solid #e4b4bc; }
    .feedback .label {
      font-family: "IBM Plex Mono", monospace;
      font-size: 0.78rem;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      margin-bottom: 0.25rem;
    }

    .topic-block {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 16px;
      box-shadow: var(--shadow);
      overflow: hidden;
    }
    .topic-head {
      width: 100%;
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 0.75rem;
      align-items: center;
      text-align: left;
      background: #f7faf7;
      border: none;
      border-bottom: 1px solid var(--line);
      border-radius: 0;
      padding: 0.9rem 1rem;
      color: inherit;
      cursor: pointer;
    }
    .topic-head h3 {
      margin: 0;
      font-family: "Source Serif 4", Georgia, serif;
      font-size: 1.1rem;
      font-weight: 700;
    }
    .topic-head .right {
      text-align: right;
      min-width: 7.5rem;
    }
    .topic-body {
      display: grid;
      gap: 0.45rem;
      padding: 0.7rem;
    }
    .topic-body.collapsed { display: none; }

    .list-item {
      display: grid;
      grid-template-columns: auto 1fr auto;
      gap: 0.75rem;
      align-items: start;
      text-align: left;
      background: #fbfcfb;
      color: inherit;
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 0.7rem 0.85rem;
      cursor: pointer;
    }
    .list-item:hover { border-color: #a9c4b8; }
    .list-item.active { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
    .list-item.solved { border-color: #b7dccf; background: #f4faf7; }
    .list-item .idx {
      font-family: "IBM Plex Mono", monospace;
      color: var(--muted);
      font-size: 0.85rem;
      padding-top: 0.15rem;
    }
    .list-item .title { font-weight: 560; line-height: 1.35; }
    .list-item .sub { color: var(--muted); font-size: 0.85rem; margin-top: 0.2rem; }
    .list-item .status, .list-item .diff {
      font-family: "IBM Plex Mono", monospace;
      font-size: 0.72rem;
      border-radius: 999px;
      padding: 0.2rem 0.5rem;
      white-space: nowrap;
    }
    .list-item .diff { color: var(--warn); background: var(--warn-soft); }
    .list-item .status.ok { color: var(--good); background: var(--good-soft); }
    .list-item .status.tried { color: var(--warn); background: var(--warn-soft); }

    footer {
      max-width: 980px;
      margin: 0 auto;
      padding: 0 1.25rem 2rem;
      color: var(--muted);
      font-size: 0.85rem;
    }
    @media (max-width: 640px) {
      .toolbar .stats { margin-left: 0; width: 100%; }
      .list-item { grid-template-columns: auto 1fr; }
      .list-item .diff, .list-item .status { grid-column: 2; justify-self: start; }
    }
  </style>
</head>
<body>
  <header>
    <div class="header-row">
      <div class="header-copy">
        <h1>GATE Practice</h1>
        <p id="sourceBlurb">Loading questions…</p>
      </div>
      <div class="auth-box" id="authBox">
        <div class="auth-meta" id="authMeta">
          <span class="sync-dot" id="syncDot"></span>
          <span id="authLabel">Checking cloud…</span>
        </div>
        <button type="button" id="signInBtn" hidden>Sign in with Google</button>
        <button type="button" class="secondary" id="signOutBtn" hidden>Sign out</button>
      </div>
    </div>
  </header>

  <main>
    <!-- HOME: subjects -->
    <section id="homeView">
      <p class="page-sub" id="homeOverall"></p>
      <div class="subject-grid" id="subjectGrid"></div>
    </section>

    <!-- SUBJECT: topics + questions + practice -->
    <section id="subjectView" class="hidden">
      <div class="breadcrumb">
        <button type="button" class="linkish" id="backHomeBtn">Subjects</button>
        <span>/</span>
        <span id="crumbSubject"></span>
      </div>
      <h2 class="page-title" id="subjectTitle"></h2>
      <p class="page-sub" id="subjectSub"></p>
      <div class="progress-track" aria-hidden="true"><div class="progress-fill" id="subjectProgressFill" style="width:0%"></div></div>
      <div class="progress-label" id="subjectProgressLabel"></div>

      <div class="toolbar" style="margin-top:0.85rem">
        <select id="topicJump" aria-label="Jump to topic">
          <option value="all">All topics</option>
        </select>
        <select id="typeFilter" aria-label="Filter by type">
          <option value="all">All types</option>
          <option value="mcq">MCQ</option>
          <option value="numerical">Numerical</option>
          <option value="short">Short answer</option>
        </select>
        <select id="progressFilter" aria-label="Filter by progress">
          <option value="all">All progress</option>
          <option value="unsolved">Unsolved only</option>
          <option value="solved">Solved only</option>
          <option value="tried">Tried</option>
        </select>
        <button class="secondary" id="nextUnsolvedBtn" type="button">Next unsolved</button>
        <select id="resetScope" aria-label="Reset scope">
          <option value="topic">Reset topic</option>
          <option value="subject">Reset subject</option>
          <option value="all">Reset all</option>
        </select>
        <button class="secondary" id="resetBtn" type="button">Reset</button>
        <div class="stats" id="stats"></div>
      </div>

      <section class="card" id="practiceCard" aria-live="polite"></section>
      <div id="topicList" style="display:grid;gap:0.85rem"></div>
    </section>
  </main>

  <footer>
    Choose a subject, then practice by topic. Sign in with Google to sync progress across devices.
  </footer>

  <script type="module">
    import confetti from "https://esm.sh/canvas-confetti@1.9.3";
    import {
      initCloud,
      isCloudConfigured,
      watchAuth,
      signInWithGoogle,
      signOutUser,
      loadCloudProgress,
      saveCloudProgress,
      mergeProgress,
    } from "./js/cloud.js";

    const STORAGE_KEY = "gate-practice-progress-v1";

    let allQuestions = [];
    let view = [];
    let currentId = null;
    let activeSubject = null;
    let activeTopicFilter = "all";
    let collapsedTopics = new Set();
    /** @type {Record<string, { status: 'solved'|'tried', at: string }>} */
    let progress = loadProgress();
    let currentUser = null;
    let cloudSaveTimer = null;
    let cloudReady = false;

    const el = (id) => document.getElementById(id);

    function loadProgress() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return {};
        const parsed = JSON.parse(raw);
        return parsed && typeof parsed === "object" ? parsed : {};
      } catch {
        return {};
      }
    }

    function saveProgressLocal() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(progress));
    }

    function scheduleCloudSave() {
      if (!currentUser || !cloudReady) return;
      clearTimeout(cloudSaveTimer);
      cloudSaveTimer = setTimeout(async () => {
        try {
          await saveCloudProgress(currentUser.uid, progress);
          setSyncUi("synced");
        } catch (err) {
          console.error(err);
          setSyncUi("error", err.message || "Cloud save failed");
        }
      }, 400);
    }

    function saveProgress() {
      saveProgressLocal();
      scheduleCloudSave();
    }

    function progressStatus(id) {
      return progress[id]?.status || null;
    }

    function markProgress(id, status) {
      const prev = progress[id];
      if (prev?.status === "solved" && status === "tried") return;
      progress[id] = { status, at: new Date().toISOString() };
      saveProgress();
      renderAll();
    }

    function questionsForSubject(subject) {
      return allQuestions.filter((q) => q.subject === subject);
    }

    function countProgress(qs) {
      let solved = 0, tried = 0;
      qs.forEach((q) => {
        const st = progressStatus(q.id);
        if (st === "solved") solved += 1;
        else if (st === "tried") tried += 1;
      });
      return { solved, tried, total: qs.length, pct: qs.length ? Math.round((solved / qs.length) * 100) : 0 };
    }

    function subjectsList() {
      const map = new Map();
      allQuestions.forEach((q) => {
        if (!map.has(q.subject)) map.set(q.subject, []);
        map.get(q.subject).push(q);
      });
      return [...map.entries()]
        .map(([name, qs]) => ({ name, qs, ...countProgress(qs) }))
        .sort((a, b) => a.name.localeCompare(b.name));
    }

    function topicsForSubject(subject) {
      const qs = questionsForSubject(subject);
      const map = new Map();
      qs.forEach((q) => {
        if (!map.has(q.topic)) map.set(q.topic, []);
        map.get(q.topic).push(q);
      });
      return [...map.entries()]
        .map(([name, items]) => ({ name, qs: items, ...countProgress(items) }))
        .sort((a, b) => a.name.localeCompare(b.name));
    }

    async function clearProgress(scope = "all") {
      const topic = activeTopicFilter;
      const subject = activeSubject;

      const ids = allQuestions
        .filter((q) => {
          if (scope === "all") return true;
          if (scope === "subject") return subject ? q.subject === subject : true;
          if (!subject) return false;
          if (q.subject !== subject) return false;
          if (topic === "all") return true;
          return q.topic === topic;
        })
        .map((q) => q.id);

      const idSet = new Set(ids);
      const next = {};
      for (const [id, entry] of Object.entries(progress)) {
        if (!idSet.has(id)) next[id] = entry;
      }
      progress = next;

      clearTimeout(cloudSaveTimer);
      saveProgressLocal();

      if (currentUser && cloudReady) {
        setSyncUi("syncing", "Saving reset to cloud…");
        try {
          await saveCloudProgress(currentUser.uid, progress);
          setSyncUi("synced");
        } catch (err) {
          console.error(err);
          setSyncUi("error", err.message || "Cloud save failed");
          throw err;
        }
      }
      return ids.length;
    }

    function setSyncUi(mode, detail = "") {
      const dot = el("syncDot");
      const label = el("authLabel");
      if (!cloudReady) {
        dot.className = "sync-dot";
        label.textContent = "Guest · local only (cloud not configured)";
        el("signInBtn").hidden = true;
        el("signOutBtn").hidden = true;
        return;
      }
      if (mode === "guest") {
        dot.className = "sync-dot";
        label.textContent = "Guest · progress saved on this device";
        el("signInBtn").hidden = false;
        el("signOutBtn").hidden = true;
      } else if (mode === "syncing") {
        dot.className = "sync-dot warn";
        label.textContent = detail || "Syncing…";
      } else if (mode === "error") {
        dot.className = "sync-dot warn";
        label.textContent = detail || "Cloud sync error";
      } else if (mode === "signed-in" || mode === "synced") {
        dot.className = "sync-dot on";
        const name = currentUser?.displayName || currentUser?.email || "Signed in";
        label.textContent = mode === "synced" ? `${name} · cloud synced` : `${name} · cloud ready`;
        el("signInBtn").hidden = true;
        el("signOutBtn").hidden = false;
      }
    }

    async function onUserChanged(user) {
      currentUser = user;
      if (!user) {
        setSyncUi("guest");
        renderAll();
        return;
      }
      setSyncUi("syncing", "Loading cloud progress…");
      try {
        const { progress: cloud, updatedAt } = await loadCloudProgress(user.uid);
        progress = mergeProgress(progress, cloud, updatedAt);
        saveProgressLocal();
        await saveCloudProgress(user.uid, progress);
        setSyncUi("synced");
        renderAll();
      } catch (err) {
        console.error(err);
        setSyncUi("error", err.message || "Could not load cloud progress");
        renderAll();
      }
    }

    function normalizeAnswer(s) {
      return String(s ?? "")
        .trim()
        .toLowerCase()
        .replace(/\s+/g, " ")
        .replace(/²/g, "^2")
        .replace(/ⁿ/g, "^n");
    }

    function answersMatch(user, expected) {
      const u = normalizeAnswer(user);
      const e = normalizeAnswer(expected);
      if (u === e) return true;
      const alts = {
        "2^n": ["2ⁿ", "2**n", "2n", "2^n values", "2ⁿ values"],
        "255": ["255 (decimal)", "255₁₀"],
        "44": ["44 (decimal)", "44₁₀"],
        "11101011": ["(11101011)2", "11101011₂", "11101011_2"],
        "1101011001": ["(1101011001)2", "1101011001₂"],
        "110101": ["(110101)2", "110101₂"],
        "10011100": ["(10011100)2", "10011100₂"],
        "11101111": ["(11101111)2", "11101111₂"],
        "1000000": ["(1000000)2", "1000000₂"],
        "11010100": ["(11010100)2", "11010100₂"],
      };
      for (const [canon, list] of Object.entries(alts)) {
        if (e === canon || list.map(normalizeAnswer).includes(e)) {
          if (u === canon || list.map(normalizeAnswer).includes(u)) return true;
        }
      }
      if (e.length > 40 && u.length > 20) {
        const keys = ["two-state", "two state", "2 state", "binary counting", "all 0s to all 1s"];
        return keys.some((k) => e.includes(k) && u.includes(k));
      }
      return false;
    }

    function celebrateCorrect() {
      const defaults = {
        origin: { y: 0.65 },
        zIndex: 9999,
        disableForReducedMotion: true,
      };
      confetti({ ...defaults, particleCount: 80, spread: 55, scalar: 0.95 });
      setTimeout(() => {
        confetti({ ...defaults, particleCount: 45, angle: 60, spread: 70, origin: { x: 0, y: 0.7 } });
        confetti({ ...defaults, particleCount: 45, angle: 120, spread: 70, origin: { x: 1, y: 0.7 } });
      }, 120);
    }

    function truncate(s, n) {
      const t = s.replace(/\s+/g, " ").trim();
      return t.length > n ? t.slice(0, n - 1) + "…" : t;
    }

    function escapeHtml(s) {
      return String(s)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;");
    }

    function openSubject(name) {
      activeSubject = name;
      activeTopicFilter = "all";
      collapsedTopics = new Set();
      currentId = null;
      location.hash = `#/subject/${encodeURIComponent(name)}`;
      renderAll();
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function goHome() {
      activeSubject = null;
      currentId = null;
      location.hash = "#/";
      renderAll();
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function applySubjectFilters() {
      if (!activeSubject) {
        view = [];
        return;
      }
      const type = el("typeFilter").value;
      const prog = el("progressFilter").value;
      view = questionsForSubject(activeSubject).filter((q) => {
        if (activeTopicFilter !== "all" && q.topic !== activeTopicFilter) return false;
        if (type !== "all" && q.type !== type) return false;
        const st = progressStatus(q.id);
        if (prog === "unsolved" && st === "solved") return false;
        if (prog === "solved" && st !== "solved") return false;
        if (prog === "tried" && st !== "tried") return false;
        return true;
      });
      if (currentId && !view.find((q) => q.id === currentId)) {
        currentId = null;
      }
    }

    function updateResetScopeLabels() {
      const sel = el("resetScope");
      if (!sel || !activeSubject) return;
      const topic = activeTopicFilter;
      sel.options[0].textContent = topic === "all"
        ? `Reset all topics in ${activeSubject}`
        : `Reset topic: ${topic}`;
      sel.options[1].textContent = `Reset subject: ${activeSubject}`;
      sel.options[2].textContent = "Reset all progress";
    }

    function renderHome() {
      const subjects = subjectsList();
      const overall = countProgress(allQuestions);
      el("homeOverall").textContent =
        `${subjects.length} subject${subjects.length === 1 ? "" : "s"} · ${overall.solved}/${overall.total} solved overall` +
        (overall.tried ? ` · ${overall.tried} tried` : "");

      const grid = el("subjectGrid");
      grid.innerHTML = "";
      subjects.forEach((s) => {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "subject-card";
        btn.innerHTML = `
          <h2>${escapeHtml(s.name)}</h2>
          <div class="meta">${s.total} questions · ${topicsForSubject(s.name).length} topics</div>
          <div class="progress-track"><div class="progress-fill" style="width:${s.pct}%"></div></div>
          <div class="meta">${s.solved}/${s.total} solved${s.tried ? ` · ${s.tried} tried` : ""} · ${s.pct}%</div>
        `;
        btn.addEventListener("click", () => openSubject(s.name));
        grid.appendChild(btn);
      });
    }

    function renderSubject() {
      const qs = questionsForSubject(activeSubject);
      const stats = countProgress(qs);
      el("crumbSubject").textContent = activeSubject;
      el("subjectTitle").textContent = activeSubject;
      el("subjectSub").textContent = `${stats.total} questions across ${topicsForSubject(activeSubject).length} topics`;
      el("subjectProgressFill").style.width = `${stats.pct}%`;
      el("subjectProgressLabel").textContent =
        `${stats.solved}/${stats.total} solved${stats.tried ? ` · ${stats.tried} tried` : ""} · ${stats.pct}%`;

      const jump = el("topicJump");
      const prev = activeTopicFilter;
      jump.innerHTML = `<option value="all">All topics</option>`;
      topicsForSubject(activeSubject).forEach((t) => {
        const opt = document.createElement("option");
        opt.value = t.name;
        opt.textContent = `${t.name} (${t.solved}/${t.total})`;
        jump.appendChild(opt);
      });
      jump.value = [...jump.options].some((o) => o.value === prev) ? prev : "all";
      activeTopicFilter = jump.value;

      applySubjectFilters();
      updateResetScopeLabels();

      el("stats").textContent = `${view.filter((q) => progressStatus(q.id) === "solved").length}/${view.length} in view`;

      renderPractice();
      renderTopicGroups();
    }

    function renderTopicGroups() {
      const list = el("topicList");
      list.innerHTML = "";

      const byTopic = new Map();
      view.forEach((q) => {
        if (!byTopic.has(q.topic)) byTopic.set(q.topic, []);
        byTopic.get(q.topic).push(q);
      });

      if (!byTopic.size) {
        list.innerHTML = `<p class="page-sub">No questions match these filters.</p>`;
        return;
      }

      let idx = 0;
      [...byTopic.entries()]
        .sort((a, b) => a[0].localeCompare(b[0]))
        .forEach(([topic, qs]) => {
          const tStats = countProgress(qs);
          const block = document.createElement("div");
          block.className = "topic-block";
          block.dataset.topic = topic;

          const collapsed = collapsedTopics.has(topic);
          const head = document.createElement("button");
          head.type = "button";
          head.className = "topic-head";
          head.innerHTML = `
            <div>
              <h3>${escapeHtml(topic)}</h3>
              <div class="progress-label" style="margin-top:0.25rem">${qs.length} shown · ${tStats.solved} solved</div>
            </div>
            <div class="right">
              <div class="progress-track" style="width:7rem;margin-left:auto"><div class="progress-fill" style="width:${tStats.pct}%"></div></div>
              <div class="progress-label">${tStats.pct}% · ${collapsed ? "Show" : "Hide"}</div>
            </div>
          `;
          head.addEventListener("click", () => {
            if (collapsedTopics.has(topic)) collapsedTopics.delete(topic);
            else collapsedTopics.add(topic);
            renderTopicGroups();
          });

          const body = document.createElement("div");
          body.className = "topic-body" + (collapsed ? " collapsed" : "");
          qs.forEach((q) => {
            idx += 1;
            const st = progressStatus(q.id);
            const btn = document.createElement("button");
            btn.type = "button";
            btn.className = "list-item" +
              (q.id === currentId ? " active" : "") +
              (st === "solved" ? " solved" : "");
            const statusHtml = st === "solved"
              ? `<span class="status ok">solved</span>`
              : st === "tried"
                ? `<span class="status tried">tried</span>`
                : `<span class="diff">${escapeHtml(q.difficulty)}</span>`;
            btn.innerHTML = `
              <span class="idx">${String(idx).padStart(2, "0")}</span>
              <span>
                <div class="title">${escapeHtml(truncate(q.question, 110))}</div>
                <div class="sub">${q.type}</div>
              </span>
              ${statusHtml}
            `;
            btn.addEventListener("click", () => {
              currentId = q.id;
              renderPractice();
              renderTopicGroups();
              el("practiceCard").scrollIntoView({ behavior: "smooth", block: "start" });
            });
            body.appendChild(btn);
          });

          block.appendChild(head);
          block.appendChild(body);
          list.appendChild(block);
        });
    }

    function renderPractice() {
      const card = el("practiceCard");
      if (!activeSubject) return;
      const q = view.find((x) => x.id === currentId);
      if (!q) {
        card.innerHTML = `<p style="margin:0;color:var(--muted)">Select a question below to practice.</p>`;
        return;
      }
      const idx = view.findIndex((x) => x.id === q.id) + 1;
      const st = progressStatus(q.id);
      let body = `
        <div class="meta-row">
          <span class="chip">${escapeHtml(q.subject)}</span>
          <span class="chip muted">${escapeHtml(q.topic)}</span>
          <span class="chip muted">${idx}/${view.length}</span>
          ${st === "solved" ? `<span class="chip ok">Solved</span>` : ""}
          ${st === "tried" ? `<span class="chip muted">Tried</span>` : ""}
        </div>
        <p class="q-text">${escapeHtml(q.question)}</p>
      `;
      if (q.type === "mcq" && Array.isArray(q.options)) {
        body += `<div class="options">`;
        q.options.forEach((opt, i) => {
          body += `
            <label class="option">
              <input type="radio" name="opt" value="${escapeHtml(opt)}" />
              <span><strong>${String.fromCharCode(65 + i)}.</strong> ${escapeHtml(opt)}</span>
            </label>`;
        });
        body += `</div>`;
      } else {
        body += `<input class="answer-box" id="freeAnswer" type="text" placeholder="Type your answer" autocomplete="off" />`;
      }
      body += `
        <div class="actions">
          <button type="button" id="checkBtn">Check</button>
          <button type="button" class="secondary" id="revealBtn">Show answer</button>
          <button type="button" class="secondary" id="nextBtn">Next</button>
          <button type="button" class="secondary" id="markSolvedBtn">Mark solved</button>
        </div>
        <div class="feedback" id="feedback"></div>
      `;
      card.innerHTML = body;

      card.querySelectorAll(".option").forEach((lab) => {
        lab.addEventListener("click", () => {
          card.querySelectorAll(".option").forEach((x) => x.classList.remove("selected"));
          lab.classList.add("selected");
          lab.querySelector("input").checked = true;
        });
      });
      el("checkBtn").addEventListener("click", () => checkAnswer(q));
      el("revealBtn").addEventListener("click", () => revealAnswer(q));
      el("markSolvedBtn").addEventListener("click", () => {
        const wasSolved = progressStatus(q.id) === "solved";
        markProgress(q.id, "solved");
        if (!wasSolved) celebrateCorrect();
      });
      el("nextBtn").addEventListener("click", () => goNext(false));
      const free = el("freeAnswer");
      if (free) {
        free.addEventListener("keydown", (e) => {
          if (e.key === "Enter") checkAnswer(q);
        });
      }
    }

    function goNext(unsolvedOnly) {
      if (!view.length) return;
      const start = Math.max(0, view.findIndex((x) => x.id === currentId));
      for (let step = 1; step <= view.length; step++) {
        const q = view[(start + step) % view.length];
        if (!unsolvedOnly || progressStatus(q.id) !== "solved") {
          currentId = q.id;
          renderPractice();
          renderTopicGroups();
          el("practiceCard").scrollIntoView({ behavior: "smooth", block: "start" });
          return;
        }
      }
    }

    function getUserAnswer(q) {
      if (q.type === "mcq") {
        const sel = document.querySelector('input[name="opt"]:checked');
        return sel ? sel.value : "";
      }
      return el("freeAnswer")?.value ?? "";
    }

    function checkAnswer(q) {
      const user = getUserAnswer(q);
      const fb = el("feedback");
      if (!user.trim()) {
        fb.className = "feedback show no";
        fb.innerHTML = `<div class="label">Missing</div>Enter or select an answer first.`;
        return;
      }
      const ok = answersMatch(user, q.answer);
      markProgress(q.id, ok ? "solved" : "tried");
      if (ok) celebrateCorrect();

      const feedbackHtml = ok
        ? `<div class="label">Correct · saved as solved</div>${escapeHtml(q.explanation || q.answer)}`
        : `<div class="label">Not quite · marked tried</div>Expected: <strong>${escapeHtml(q.answer)}</strong><br/>${escapeHtml(q.explanation || "")}`;
      const feedbackClass = "feedback show " + (ok ? "ok" : "no");
      renderPractice();
      const fb2 = el("feedback");
      if (fb2) {
        fb2.className = feedbackClass;
        fb2.innerHTML = feedbackHtml;
      }
      if (q.type === "mcq") {
        document.querySelectorAll(".option").forEach((lab) => {
          const val = lab.querySelector("input").value;
          if (answersMatch(val, q.answer)) lab.classList.add("correct");
        });
      }
    }

    function revealAnswer(q) {
      if (progressStatus(q.id) !== "solved") {
        markProgress(q.id, "tried");
      } else {
        renderPractice();
        renderTopicGroups();
      }
      const fb = el("feedback");
      if (!fb) return;
      fb.className = "feedback show ok";
      fb.innerHTML = `<div class="label">Answer</div><strong>${escapeHtml(q.answer)}</strong><br/>${escapeHtml(q.explanation || "")}`;
      if (q.type === "mcq") {
        document.querySelectorAll(".option").forEach((lab) => {
          const val = lab.querySelector("input").value;
          if (answersMatch(val, q.answer)) lab.classList.add("correct");
        });
      }
    }

    function renderAll() {
      const onHome = !activeSubject;
      el("homeView").classList.toggle("hidden", !onHome);
      el("subjectView").classList.toggle("hidden", onHome);
      if (onHome) renderHome();
      else renderSubject();
    }

    function syncFromHash() {
      const raw = decodeURIComponent((location.hash || "#/").replace(/^#/, ""));
      const m = raw.match(/^\/subject\/(.+)$/);
      if (m) {
        const name = m[1];
        if (allQuestions.some((q) => q.subject === name)) {
          activeSubject = name;
          return;
        }
      }
      activeSubject = null;
    }

    el("backHomeBtn").addEventListener("click", goHome);
    el("topicJump").addEventListener("change", () => {
      activeTopicFilter = el("topicJump").value;
      currentId = null;
      renderSubject();
    });
    el("typeFilter").addEventListener("change", () => renderSubject());
    el("progressFilter").addEventListener("change", () => renderSubject());
    el("nextUnsolvedBtn").addEventListener("click", () => goNext(true));
    el("resetBtn").addEventListener("click", async () => {
      const scope = el("resetScope").value;
      let target = "all progress";
      if (scope === "subject") target = `subject “${activeSubject}”`;
      else if (scope === "topic") {
        target = activeTopicFilter === "all"
          ? `all topics in “${activeSubject}”`
          : `topic “${activeTopicFilter}”`;
      }
      const cloudNote = currentUser
        ? " This updates your Google account cloud progress too."
        : " This only clears progress on this browser until you sign in.";
      if (!confirm(`Reset progress for ${target}?${cloudNote}`)) return;
      el("resetBtn").disabled = true;
      try {
        const n = await clearProgress(scope);
        renderAll();
        alert(`Cleared progress on ${n} question${n === 1 ? "" : "s"}.`);
      } catch (err) {
        alert(`Reset saved locally, but cloud sync failed: ${err.message || err}`);
        renderAll();
      } finally {
        el("resetBtn").disabled = false;
      }
    });

    el("signInBtn").addEventListener("click", async () => {
      try {
        setSyncUi("syncing", "Opening Google sign-in…");
        await signInWithGoogle();
      } catch (err) {
        console.error(err);
        setSyncUi("error", err.message || "Sign-in failed");
      }
    });
    el("signOutBtn").addEventListener("click", async () => {
      try {
        await signOutUser();
      } catch (err) {
        console.error(err);
        setSyncUi("error", err.message || "Sign-out failed");
      }
    });

    window.addEventListener("hashchange", () => {
      syncFromHash();
      renderAll();
    });

    cloudReady = initCloud();
    if (cloudReady) watchAuth(onUserChanged);
    else {
      setSyncUi("guest");
      if (!isCloudConfigured()) {
        el("authLabel").textContent = "Guest · local only (set up Firebase to sync)";
      }
    }

    fetch("data/questions.json")
      .then((r) => {
        if (!r.ok) throw new Error("Could not load data/questions.json");
        return r.json();
      })
      .then((data) => {
        if (Array.isArray(data.subjects)) {
          allQuestions = data.subjects.flatMap((s) =>
            (s.questions || []).map((q) => ({
              ...q,
              subject: q.subject || s.name,
            }))
          );
        } else {
          allQuestions = data.questions || [];
        }
        const syncHint = cloudReady
          ? "Sign in to sync progress across devices."
          : "Progress is tracked locally.";
        el("sourceBlurb").textContent =
          `${allQuestions.length} questions · pick a subject to begin. ${syncHint}`;
        syncFromHash();
        renderAll();
      })
      .catch((err) => {
        el("sourceBlurb").textContent = err.message + " — open via a local server (python3 -m http.server).";
      });
  </script>
</body>
</html>
